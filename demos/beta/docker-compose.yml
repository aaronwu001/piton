# Milestone beta - environment definition.
#
# Beta is crash recovery: the orchestrator is killed mid-run and must resume,
# and content already in the dead-letter queue must be left alone. That makes
# this environment different from alpha's and gamma's in one structural way:
#
#   THE ORCHESTRATOR MUST BE KILLABLE AND RESTARTABLE BY HAND.
#
# So it carries `restart: "no"`. Docker restarting the container by itself would
# take the demonstration away from the operator - he would never see the state
# the crash left behind, because something else would have repaired it before he
# looked. SPEC.md 13 guarantees the SYSTEM recovers; the demo has to let a human
# watch that happen.
#
# CLAUDE.md 5.5.4 requires the automated suite to reference this file rather
# than define an environment of its own.
#
# Teardown between runs is `docker compose down -v`. The volume wipe is not
# optional: CLAUDE.md 5.5.2 requires every group to start from a clean database.

name: piton-beta

services:

  # ---------------------------------------------------------------- postgres
  postgres:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_USER: piton
      POSTGRES_PASSWORD: piton
      POSTGRES_DB: piton
    volumes:
      # Postgres 18+ wants ONE mount at /var/lib/postgresql. See alpha's file.
      - pgdata:/var/lib/postgresql
    # No host port, for the reason alpha's file gives.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U piton -d piton"]
      interval: 1s
      timeout: 3s
      retries: 60

  # ------------------------------------------------------------ orchestrator
  orchestrator:
    build:
      context: ../..
      dockerfile_inline: |
        FROM golang:1.27-alpine AS build
        WORKDIR /src
        COPY . .
        RUN CGO_ENABLED=0 go build -trimpath -o /out/piton ./cmd/piton

        FROM alpine:3.22
        COPY --from=build /out/piton /usr/local/bin/piton
        ENTRYPOINT ["/usr/local/bin/piton"]
    command: ["--config", "/etc/piton/piton.yaml"]
    volumes:
      - ./piton.yaml:/etc/piton/piton.yaml:ro
      # The second configuration file exists only for the startup leg: it names
      # a database host that does not resolve, so that SPEC.md 13.1.5 - "storage
      # unreachable at startup: fail fast: non-zero exit, and an error message
      # that names storage as the cause" - can be run rather than assumed.
      - ./piton-badstorage.yaml:/etc/piton/piton-badstorage.yaml:ro
    ports:
      - "8080:8080"
    # THE KEY LINE OF THIS FILE. Without it, `docker compose kill orchestrator`
    # would be undone by Docker before the operator could look at the database,
    # and every assertion about what a crash leaves behind would be racing a
    # restart nobody asked for. The recovery under test is Piton's (SPEC.md 13),
    # never the container runtime's.
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
      worker:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://127.0.0.1:8080/healthz >/dev/null 2>&1 || exit 1"]
      interval: 1s
      timeout: 3s
      retries: 60
      start_period: 3s

  # ------------------------------------------------------------------ worker
  #
  # Beta's worker needs one thing gamma's did not: a step that is still running
  # when the orchestrator is killed. Without it there is no "mid-run" to crash
  # in the middle of, and leg 1 would be a race against a worker that answers in
  # milliseconds.
  #
  # params.mode:
  #
  #   echo          immediate success (SPEC.md 9.6 sync+envelope success shape)
  #   slow          sleeps params.sleep_seconds, then succeeds. The step the
  #                 operator kills the orchestrator during
  #   worker_error  200 carrying a failure envelope, so that a run can be driven
  #                 into DLQ before the crash - which is what SPEC.md 13.2.7,
  #                 "recovery never auto-replays a DLQ'd run", needs in order to
  #                 be observable at all
  #
  # A slow worker is also the only way to see SPEC.md 13.2.1 honestly: the
  # re-dispatch after a crash may re-run a step that was actually executing, so
  # "the worker must be idempotent on step_id" is a real obligation and not a
  # theoretical one. This worker records every call it receives, keyed on
  # step_id, and the demo prints that record.
  worker:
    image: python:3.13-alpine
    command:
      - python
      - -u
      - -c
      - |
        import json, threading, time
        from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer

        calls = {}
        lock = threading.Lock()

        def record(step_id):
            with lock:
                calls[step_id] = calls.get(step_id, 0) + 1
                return calls[step_id]

        class Handler(BaseHTTPRequestHandler):
            protocol_version = "HTTP/1.1"

            def do_GET(self):
                if self.path == "/healthz":
                    self._reply(200, {"status": "ok"})
                elif self.path == "/calls":
                    # Not part of any SPEC contract - a window into the worker
                    # for the operator, so that SPEC.md 13.2.1's duplicate
                    # execution can be counted rather than argued about.
                    with lock:
                        self._reply(200, {"status": "ok", "calls": dict(calls)})
                else:
                    self._reply(404, {"status": "failure",
                                      "error": "no such path: " + self.path})

            def do_POST(self):
                if self.path != "/work":
                    self._reply(404, {"status": "failure",
                                      "error": "no such path: " + self.path})
                    return
                length = int(self.headers.get("content-length") or 0)
                body = self.rfile.read(length) if length else b""
                try:
                    env = json.loads(body or b"{}")
                except Exception as exc:
                    self._reply(400, {"status": "failure",
                                      "error": "unparseable body: %s" % exc})
                    return

                params = env.get("params") or {}
                mode = params.get("mode", "echo")
                n = record(env.get("step_id"))

                if mode == "worker_error":
                    self._reply(200, {"status": "failure",
                                      "error": "worker_error: asked to report failure (call %d)" % n})
                    return

                if mode == "slow":
                    # The orchestrator is killed while this sleep is in
                    # progress. The reply, if it is ever sent, lands on a
                    # connection whose other end died - which is exactly
                    # SPEC.md 8.6's reason for expiring a sync attempt at claim
                    # time regardless of deadline_at.
                    time.sleep(float(params.get("sleep_seconds", 10)))

                self._reply(200, {"status": "success",
                                  "output": {"mode": mode,
                                             "call_number_for_this_step": n,
                                             "step_id": env.get("step_id"),
                                             "attempt_id": env.get("attempt_id")}})

            def _reply(self, code, payload):
                raw = json.dumps(payload).encode("utf-8")
                try:
                    self.send_response(code)
                    self.send_header("content-type", "application/json")
                    self.send_header("content-length", str(len(raw)))
                    self.end_headers()
                    self.wfile.write(raw)
                except Exception:
                    # The orchestrator was killed while this handler slept, so
                    # there is no longer anyone to answer. Not an error: it is
                    # the situation beta exists to demonstrate.
                    pass

            def log_message(self, fmt, *args):
                print("worker: " + (fmt % args), flush=True)

        print("worker: listening on 0.0.0.0:9090", flush=True)
        ThreadingHTTPServer(("0.0.0.0", 9090), Handler).serve_forever()
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://127.0.0.1:9090/healthz >/dev/null 2>&1 || exit 1"]
      interval: 1s
      timeout: 3s
      retries: 60

volumes:
  pgdata:
