# Milestone alpha - the orchestrator's boot configuration.
#
# SPEC.md 4.4: "The orchestrator reads one YAML configuration file at boot. It
# declares at minimum the storage backend and its connection details, the HTTP
# listen address, the sweep interval, the heartbeat interval and the lease TTL."
#
# SPEC.md fixes WHAT this file must declare. It does not fix the key names, so
# the names below are this demo's choice, not a ratified rule. Two conventions
# were followed rather than invented freely:
#
#   * every name reuses SPEC's own vocabulary - "backend", "listen address",
#     "sweep interval", "heartbeat interval", "lease TTL";
#   * durations carry the `_seconds` suffix, matching the naming convention
#     SPEC.md 11.1 already uses for step_timeout_seconds and friends, rather
#     than introducing a second duration style in the same system.
#
# SPEC.md 9.1: configuration files on disk are YAML, and YAML earns its place
# by permitting comments - which is why this header can exist at all.

storage:
  # SPEC.md 4.4: "The storage backend is a value in that file", in support of
  # the storage abstraction of SPEC.md 7. Postgres is today's only
  # implementation, not a hard-coded assumption.
  backend: postgres

  # `postgres` is the compose service name (docker-compose.yml), not localhost:
  # SPEC.md 4.4 states the database "is not assumed to be on the same host".
  dsn: "postgres://piton:piton@postgres:5432/piton?sslmode=disable"

http:
  # Container-internal. The host reaches this through the published port in
  # docker-compose.yml, which is what SPEC.md 18.1's `localhost:8080` refers to.
  listen_address: "0.0.0.0:8080"

# The three numbers that govern ownership. They are written out at their SPEC
# defaults rather than left implicit, so that an operator reading this file sees
# all three in one place instead of inferring them from the document.
#
#   sweep_interval_seconds     SPEC.md 8.6 - "5 seconds by default". It is also
#                              the width of SPEC.md 13.3's uncertainty window.
#   heartbeat_interval_seconds SPEC.md 8.7 - heartbeat every 10 s.
#   lease_ttl_seconds          SPEC.md 8.7 - 30 s, which tolerates two missed
#                              heartbeats before another orchestrator may take
#                              over. An orchestrator is live iff
#                              last_seen_at > now() - lease_ttl.
#
# demo.sh's final assertion - "exactly one row in orchestrators, recently seen"
# (SPEC.md 18.1) - reads lease_ttl_seconds from this file to decide what
# "recently" means, so these values and that check cannot drift apart.
sweep_interval_seconds: 5
heartbeat_interval_seconds: 10
lease_ttl_seconds: 30
